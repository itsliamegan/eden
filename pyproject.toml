[project]
name = "eden"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"helios-url",
	"luna",
]

[dependency-groups]
dev = [
	"ruff>=0.16.10",
	"ty>=0.0.84",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
helios-url = { git = "https://github.com/itsliamegan/helios", subdirectory = "packages/url", branch = "main" }
luna = { git = "https://github.com/itsliamegan/luna", branch = "main" }

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["eden"]
force-sort-within-sections = true
order-by-type = false
