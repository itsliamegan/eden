[project]
name = "eden"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"cattrs>=26.2.1",
	"helios-assets",
	"helios-url",
	"helios-view",
	"luna",
	"marko>=2.2.4",
	"markupsafe>=3.0.4",
	"watchfiles>=1.3.0",
	"werkzeug>=3.1.8",
]

[project.scripts]
eden = "eden.__main__:main"

[dependency-groups]
dev = [
	"ruff>=0.16.10",
	"ty>=0.0.84",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
helios-assets = { git = "https://github.com/itsliamegan/helios", subdirectory = "packages/assets", branch = "main" }
helios-url = { git = "https://github.com/itsliamegan/helios", subdirectory = "packages/url", branch = "main" }
helios-view = { git = "https://github.com/itsliamegan/helios", subdirectory = "packages/view", branch = "main" }
luna = { git = "https://github.com/itsliamegan/helios", subdirectory = "packages/luna", branch = "main" }

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["eden"]
force-sort-within-sections = true
order-by-type = false
