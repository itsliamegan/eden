[project]
name = "eden"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"cmarkgfm>=2025.10.22",
	"pybars3>=0.9.7",
	"toml>=0.10.2",
]

[project.scripts]
eden = "eden:main"

[dependency-groups]
dev = [
	"pytest>=9.1.1",
	"ruff>=0.16.10",
	"ty>=0.0.84",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["eden"]
force-sort-within-sections = true
order-by-type = false
